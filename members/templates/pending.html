<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pending Approval - SPB Data Science Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Public+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/members.css?v=5" />
</head>
<body>
<div class="auth-page">
  <div class="auth-grid"></div>
  <div class="auth-glow"></div>

  <div class="auth-card" style="text-align:center;">
    <div style="width:52px;height:52px;background:rgba(102,0,51,.15);border:1px solid rgba(102,0,51,.3);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--burgundy-xl)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
    </div>

    <h1 class="auth-title">Request submitted</h1>
    <p class="auth-subtitle">Your membership request is pending approval. A club admin will review it shortly.</p>

    <div class="auth-divider"></div>

    <p style="font-size:.78rem;color:var(--text-muted);line-height:1.7;">
      Check back later or reach out to a club officer if you have questions.<br>
      You can sign in again at any time to check your status.
    </p>

    <a href="/logout" class="btn btn-ghost" style="margin-top:1.5rem;width:100%;justify-content:center;">Sign out</a>
  </div>
</div>
</body>
</html>
