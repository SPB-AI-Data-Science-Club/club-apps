<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complete Profile - SPB Data Science Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Public+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/members.css?v=5" />
</head>
<body>
<div class="auth-page">
  <div class="auth-grid"></div>
  <div class="auth-glow"></div>

  <div class="auth-card" style="max-width:460px;">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div>
        <div class="auth-club-name">SPB Data Science Club</div>
        <div class="auth-club-sub">Complete Your Profile</div>
      </div>
    </div>

    <div class="auth-divider"></div>

    <h1 class="auth-title" style="font-size:1.2rem;">One more step</h1>
    <p class="auth-subtitle">Add your details to join. Use your school email to get instant access.</p>

    {% if error %}
    <div class="auth-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/complete-profile">
      <div class="form-row">
        <label for="name">Full Name</label>
        <input class="form-input" type="text" id="name" name="name"
               value="{{ google_name }}" placeholder="Your full name" required />
      </div>

      <div class="form-row">
        <label for="school_email">School Email</label>
        <input class="form-input" type="email" id="school_email" name="school_email"
               placeholder="you@stratfordschools.net" required />
      </div>

      <div class="form-row">
        <label for="grade">Class of</label>
        <select class="form-select" id="grade" name="grade" required>
          <option value="" disabled selected>Select</option>
          <option value="2026">Class of 2026</option>
          <option value="2027">Class of 2027</option>
          <option value="2028">Class of 2028</option>
          <option value="2029">Class of 2029</option>
          <option value="2030">Class of 2030</option>
          <option value="2031">Class of 2031</option>
          <option value="2032">Class of 2032</option>
        </select>
      </div>

      <div class="form-row">
        <label>I am a</label>
        <div style="display:flex;gap:.75rem;">
          <label class="form-check" style="flex:1;background:var(--surface-2);border:1px solid var(--border-l);border-radius:7px;padding:.55rem .85rem;">
            <input type="radio" name="role" value="student" checked /> Student
          </label>
          <label class="form-check" style="flex:1;background:var(--surface-2);border:1px solid var(--border-l);border-radius:7px;padding:.55rem .85rem;">
            <input type="radio" name="role" value="teacher" /> Teacher
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.5rem;padding:.7rem;">
        Send verification code
      </button>
    </form>

    <p class="auth-note">We email a code to your school address (@stratfordschools.net or .com) to confirm you are a Stratford student.</p>
  </div>
</div>
</body>
</html>
