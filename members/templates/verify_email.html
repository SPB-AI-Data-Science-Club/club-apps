<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email - SPB Data Science Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Public+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/members.css?v=5" />
</head>
<body>
<div class="auth-page">
  <div class="auth-grid"></div>
  <div class="auth-glow"></div>

  <div class="auth-card" style="max-width:460px;">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div>
        <div class="auth-club-name">SPB Data Science Club</div>
        <div class="auth-club-sub">Verify Your Email</div>
      </div>
    </div>

    <div class="auth-divider"></div>

    <h1 class="auth-title" style="font-size:1.2rem;">Check your school inbox</h1>
    <p class="auth-subtitle">We sent a 6-digit code to <strong>{{ email }}</strong>. Enter it below to finish joining.</p>

    {% if error %}
    <div class="auth-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/verify-email">
      <div class="form-row">
        <label for="code">Verification code</label>
        <input class="form-input" type="text" id="code" name="code"
               inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code"
               placeholder="000000" required
               style="letter-spacing:.4em;text-align:center;font-family:'JetBrains Mono',monospace;font-size:1.15rem;" />
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.5rem;padding:.7rem;">
        Verify and join
      </button>
    </form>

    <form method="POST" action="/verify-email/resend" style="margin-top:.75rem;">
      <button type="submit" class="btn" style="width:100%;justify-content:center;padding:.55rem;background:var(--surface-2);border:1px solid var(--border-l);">
        Resend code
      </button>
    </form>

    <p class="auth-note">The code expires in 15 minutes. Wrong address? <a href="/complete-profile">Change it</a>.</p>
  </div>
</div>
</body>
</html>
