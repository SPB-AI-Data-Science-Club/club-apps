# SPB Club live demos. Deployed 2026-08-24 on the rebuilt VPS.
# Only the demos that actually run on a 1 GB CPU-only box are here; the
# PyTorch-based ones (digits, classifier, neural, sentiment) and the ones that
# proxy to the wiped GPU machine (photo) are NOT deployed.
# Port map follows club-apps/docs/DEPLOY-REFERENCE.txt.
#
# REQUIRES these zones in the http block of /etc/nginx/nginx.conf (a zone cannot
# be declared in a site file, and nginx will not start if one is missing):
#   limit_req_zone  $binary_remote_addr zone=cpu_submit:10m rate=20r/m;
#   limit_conn_zone $binary_remote_addr zone=cpu_conn:10m;
# See the rate-limit section at the top of DEPLOY-REFERENCE.txt.

# --- Pathfinding visualiser: 100% client-side, so nginx serves it directly.
#     Upstream keeps a Flask app "for parity", but it only calls
#     render_template on a file with zero Jinja tags -- no process needed.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pathfinding.spbdatascience.org;

    include /etc/nginx/snippets/ssl-origin.conf;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/sec-headers.conf;

    # Demo pages had no favicon, so every visit logged a 404. Serve the club logo.
    location = /favicon.ico {
        alias /var/www/spb-club/portfolio/logo.png;
        access_log off;
        expires 30d;
    }

    root /var/www/spb-club/demos/pathfinding;
    index index.html;

    location ~ /\. { deny all; access_log off; log_not_found off; }
    location / { try_files $uri $uri/ =404; }
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ { expires 30d; }

    access_log /var/log/nginx/spb-demos.access.log;
    error_log  /var/log/nginx/spb-demos.error.log;
}

# --- Art style transfer (CPU, PIL/NumPy) -> spb-style.service
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name style.spbdatascience.org;

    include /etc/nginx/snippets/ssl-origin.conf;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/sec-headers.conf;

    # Demo pages had no favicon, so every visit logged a 404. Serve the club logo.
    location = /favicon.ico {
        alias /var/www/spb-club/portfolio/logo.png;
        access_log off;
        expires 30d;
    }

    client_max_body_size 12m;   # visitors upload images

    # Image filtering is the most expensive thing this box does: PIL/NumPy work
    # on a 1 vCPU machine, behind `gunicorn -w 1`, with a 120s read timeout. One
    # client looping this endpoint occupies the only worker and takes the demo
    # down for everyone. The pre-teardown config rate-limited the GPU submit
    # paths; this is the CPU equivalent, and it is the one that is actually live.
    location = /api/transform {
        limit_req zone=cpu_submit burst=5 nodelay;
        limit_conn cpu_conn 2;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:15006;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:15006;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/spb-demos.access.log;
    error_log  /var/log/nginx/spb-demos.error.log;
}

# --- Language model playground (n-gram, stdlib only) -> spb-textgen.service
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name textgen.spbdatascience.org;

    include /etc/nginx/snippets/ssl-origin.conf;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/sec-headers.conf;

    # Demo pages had no favicon, so every visit logged a 404. Serve the club logo.
    location = /favicon.ico {
        alias /var/www/spb-club/portfolio/logo.png;
        access_log off;
        expires 30d;
    }

    # Custom-corpus generation rebuilds an n-gram model per request with no
    # cache, so it is CPU-bound in the same way /api/transform is.
    location = /api/generate {
        limit_req zone=cpu_submit burst=5 nodelay;
        limit_conn cpu_conn 2;
        limit_req_status 429;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:15009;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:15009;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/spb-demos.access.log;
    error_log  /var/log/nginx/spb-demos.error.log;
}
